<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 증명사진관 & 여권민원실 찾기</title>
    <!-- 카카오맵 API (Kakao Maps SDK & services, roadview 라이브러리) -->
    <!-- APP_KEY 부분에 본인의 Kakao JavaScript 키를 넣으세요 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_APP_KEY&libraries=services"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }
        /* 메인 컨테이너 레이아웃 */
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* 왼쪽 사이드바 (탭 & 검색 리스트) */
        #sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        /* 탭 버튼 영역 */
        .tab-container {
            display: flex;
            background-color: #e9ecef;
        }
        .tab-btn {
            flex: 1;
            padding: 15px 10px;
            border: none;
            background-color: #e9ecef;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #228be6;
            border-bottom: 3px solid #228be6;
        }
        /* 장소 리스트 영역 */
        #place-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .place-item {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .place-item:hover {
            background-color: #edf2ff;
        }
        .place-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .place-address {
            font-size: 13px;
            color: #666;
            margin-bottom: 3px;
        }
        .place-phone {
            font-size: 12px;
            color: #888;
        }
        /* 오른쪽 뷰 영역 (지도 & 로드뷰) */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* 카카오 지도 영역 */
        #map {
            flex: 1;
            width: 100%;
        }
        /* 로드뷰 영역 */
        #roadview-container {
            height: 40%;
            width: 100%;
            border-top: 2px solid #ccc;
            position: relative;
        }
        #roadview {
            width: 100%;
            height: 100%;
        }
        /* 로드뷰 없음 안내 문구 커스텀 */
        #roadview-no-data {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(245, 245, 245, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            z-index: 5;
        }
        /* 커스텀 이모티콘 마커 스타일 */
        .custom-emoji-marker {
            background: #ffffff;
            border: 2px solid #333;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        /* 인포윈도우 스타일 */
        .info-window {
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
            min-width: 200px;
        }
        .info-title {
            font-weight: bold;
            font-size: 14px;
            color: #228be6;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- 왼쪽 사이드바 -->
        <div id="sidebar">
            <div class="tab-container">
                <button id="tab-photo" class="tab-btn active" onclick="switchTab('photo')">📸 증명사진관</button>
                <button id="tab-passport" class="tab-btn" onclick="switchTab('passport')">🧑‍💼 여권민원실</button>
            </div>
            <ul id="place-list"></ul>
        </div>

        <!-- 오른쪽 지도 및 로드뷰 -->
        <div id="main-view">
            <div id="map"></div>
            <div id="roadview-container">
                <div id="roadview"></div>
                <div id="roadview-no-data">거리뷰 없음</div>
            </div>
        </div>
    </div>

    <script>
        // 글로벌 변수 선언
        let map;
        let ps;
        let infowindow;
        let roadview;
        let roadviewClient;

        let userLatitude = 37.566826; // 기본 위치: 서울시청
        let userLongitude = 126.978656;
        
        let currentTab = 'photo'; // 현재 선택된 탭 ('photo' 또는 'passport')
        let activeMarkers = []; // 화면에 표시된 마커 객체 배열

        // 초기화 함수
        window.onload = function() {
            initMap();
            getUserLocation();
        };

        // 지도 및 로드뷰 초기화
        function initMap() {
            const mapContainer = document.getElementById('map');
            const mapOptions = {
                center: new kakao.maps.LatLng(userLatitude, userLongitude),
                level: 4
            };

            // 카카오 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 객체 생성
            ps = new kakao.maps.services.Places();

            // 공통 인포윈도우 생성
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 로드뷰 객체 및 위치 검색 서비스 객체 생성
            const roadviewContainer = document.getElementById('roadview');
            roadview = new kakao.maps.Roadview(roadviewContainer);
            roadviewClient = new kakao.maps.RoadviewClient();
        }

        // 사용자의 현재 위치 가져오기
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        userLatitude = position.coords.latitude;
                        userLongitude = position.coords.longitude;

                        const currentPos = new kakao.maps.LatLng(userLatitude, userLongitude);
                        map.setCenter(currentPos);

                        // 위치 파악 후 첫번째 탭 검색 실행
                        searchPlaces();
                    },
                    function(error) {
                        console.warn("위치 정보를 가져올 수 없어 기본 위치(서울시청)로 검색합니다.");
                        searchPlaces();
                    }
                );
            } else {
                searchPlaces();
            }
        }

        // 탭 전환 처리
        function switchTab(tabType) {
            if (currentTab === tabType) return;

            currentTab = tabType;

            // 탭 버튼 스타일 변경
            document.getElementById('tab-photo').classList.toggle('active', tabType === 'photo');
            document.getElementById('tab-passport').classList.toggle('active', tabType === 'passport');

            // 검색 재실행
            searchPlaces();
        }

        // 장소 검색 함수
        function searchPlaces() {
            // 기존 마커 및 인포윈도우, 리스트 초기화
            clearMarkers();
            infowindow.close();
            document.getElementById('place-list').innerHTML = '';

            const keyword = (currentTab === 'photo') ? '증명사진' : '여권민원실';

            const searchOptions = {
                location: new kakao.maps.LatLng(userLatitude, userLongitude),
                radius: 5000, // 반경 5km 내 검색
                sort: kakao.maps.services.SortBy.ACCURACY
            };

            // 카카오 키워드 검색 요청
            ps.keywordSearch(keyword, placesSearchCB, searchOptions);
        }

        // 검색 완료 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                const listEl = document.getElementById('place-list');
                const bounds = new kakao.maps.LatLngBounds();

                for (let i = 0; i < data.length; i++) {
                    const place = data[i];
                    const placePosition = new kakao.maps.LatLng(place.y, place.x);

                    // 마커 생성 및 지도에 표시
                    const marker = createCustomMarker(placePosition, currentTab, place);
                    activeMarkers.push(marker);

                    // 리스트 아이템 생성 및 이벤트 등록
                    const listItem = createListItem(place, i);
                    listEl.appendChild(listItem);

                    bounds.extend(placePosition);
                }

                // 검색된 모든 위치가 보이도록 지도 영역 재설정
                map.setBounds(bounds);

            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                document.getElementById('place-list').innerHTML = '<li style="padding: 20px; text-align: center; color: #888;">검색 결과가 없습니다.</li>';
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 이모티콘 커스텀 마커 생성
        function createCustomMarker(position, tabType, place) {
            const emoji = (tabType === 'photo') ? '📸' : '🧑‍💼';

            // HTML 커스텀 오버레이를 활용해 마커 생성
            const content = document.createElement('div');
            content.className = 'custom-emoji-marker';
            content.innerText = emoji;

            const customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: content,
                yAnchor: 1
            });

            customOverlay.setMap(map);

            // 마커 클릭 이벤트
            content.addEventListener('click', function() {
                selectPlace(place, position);
            });

            return customOverlay;
        }

        // 장소 클릭 시 실행 (인포윈도우 및 로드뷰 업데이트)
        function selectPlace(place, position) {
            // 전화번호 예외 처리
            const phoneText = place.phone ? place.phone : '전화번호 없음';
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;

            // 팝업(인포윈도우) 콘텐츠 설정
            const infoContent = `
                <div class="info-window">
                    <div class="info-title">${place.place_name}</div>
                    <div><b>주소:</b> ${addressText}</div>
                    <div><b>전화:</b> ${phoneText}</div>
                </div>
            `;

            infowindow.setContent(infoContent);

            // 임시 마커 객체로 인포윈도우 연동
            const tempMarker = new kakao.maps.Marker({ position: position });
            infowindow.open(map, tempMarker);

            // 지도 중심 이동
            map.panTo(position);

            // 로드뷰 연동
            updateRoadview(position);
        }

        // 로드뷰 업데이트 함수
        function updateRoadview(position) {
            const noDataEl = document.getElementById('roadview-no-data');

            // 반경 50m 이내의 가장 가까운 로드뷰 파노라마 ID 검색
            roadviewClient.getNearestPanoId(position, 50, function(panoId) {
                if (panoId === null) {
                    // 근처에 로드뷰가 없는 경우
                    noDataEl.style.display = 'flex';
                } else {
                    // 로드뷰가 있는 경우
                    noDataEl.style.display = 'none';
                    roadview.setPanoId(panoId, position);
                }
            });
        }

        // 왼쪽 사이드바 리스트 아이템 생성
        function createListItem(place, index) {
            const el = document.createElement('li');
            el.className = 'place-item';

            const phoneText = place.phone ? place.phone : '전화번호 없음';
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;

            el.innerHTML = `
                <div class="place-title">${place.place_name}</div>
                <div class="place-address">${addressText}</div>
                <div class="place-phone">${phoneText}</div>
            `;

            const position = new kakao.maps.LatLng(place.y, place.x);

            // 리스트 클릭 이벤트
            el.addEventListener('click', function() {
                selectPlace(place, position);
            });

            return el;
        }

        // 기존 마커 지우기
        function clearMarkers() {
            for (let i = 0; i < activeMarkers.length; i++) {
                activeMarkers[i].setMap(null);
            }
            activeMarkers = [];
        }
    </script>
</body>
</html>
