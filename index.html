<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 증명사진관 & 여권민원실 찾기</title>
    <!-- 카카오맵 API (services 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e8e9622fa2f314ccf70d3565b281d85e&libraries=services"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
        }
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        /* 왼쪽 사이드바 (340px 고정) */
        #sidebar {
            width: 340px;
            height: 100vh;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            flex-shrink: 0;
            z-index: 10;
        }
        .tab-group {
            display: flex;
            background-color: #eee;
            border-bottom: 1px solid #ccc;
        }
        .tab-btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            background-color: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #fff;
            color: #000;
            border-bottom: 3px solid #ffeb00;
        }
        #place-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        #place-list li {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #fff;
        }
        #place-list li:hover {
            background-color: #f0f7ff;
        }
        #place-list .place-title {
            font-weight: bold;
            font-size: 14px;
            color: #222;
            margin-bottom: 4px;
        }
        #place-list .place-address {
            font-size: 12px;
            color: #666;
            line-height: 1.3;
        }
        #place-list .place-phone {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        /* 오른쪽 메인 지도가 화면 높이 100% 전체를 사용 */
        #map {
            width: calc(100vw - 340px);
            height: 100vh;
        }

        /* 이모티콘 마커 CSS */
        .emoji-marker {
            font-size: 20px;
            background: #ffffff;
            border: 2px solid #333;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .emoji-marker:hover {
            transform: scale(1.2);
        }

        /* 커스텀 팝업 오버레이 CSS (마커 바로 위에 뜨도록 위치 고정) */
        .custom-popup {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 1px solid #999;
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            min-width: 200px;
            z-index: 999;
            white-space: nowrap;
        }
        /* 팝업 하단 말풍선 화살표 */
        .custom-popup::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        .popup-title {
            font-weight: bold;
            font-size: 14px;
            color: #111;
            margin-bottom: 4px;
            padding-right: 15px;
        }
        .popup-close {
            position: absolute;
            top: 6px;
            right: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #888;
            font-weight: bold;
        }
        .popup-close:hover {
            color: #000;
        }
        .popup-address {
            font-size: 12px;
            color: #555;
            margin-bottom: 3px;
        }
        .popup-phone {
            font-size: 12px;
            color: #0066cc;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 왼쪽 사이드바 -->
    <div id="sidebar">
        <div class="tab-group">
            <button class="tab-btn active" id="btn-photo" onclick="switchTab('photo')">📸 증명사진관</button>
            <button class="tab-btn" id="btn-passport" onclick="switchTab('passport')">🧑‍💼 여권민원실</button>
        </div>
        <ul id="place-list"></ul>
    </div>

    <!-- 메인 지도 (100% 풀사이즈) -->
    <div id="map"></div>
</div>

<script>
    // 글로벌 변수
    let map;
    let ps;
    let activeCategory = 'photo';
    
    let currentOverlayList = []; // 지도 상의 마커 리스트
    let currentPopupOverlay = null; // 현재 지도에 열려 있는 단 하나의 팝업 오버레이
    let accumulatedPlaces = []; // 검색된 장소 목록

    const TAB_CONFIG = {
        photo: { keyword: '증명사진', emoji: '📸' },
        passport: { keyword: '여권민원실', emoji: '🧑‍💼' }
    };

    // 전국에 마커가 균일하게 뜨도록 주요 지점 다중 검색
    const REGION_CENTERS = [
        "서울", "경기 수원", "경기 고양", "인천", "강원 춘천", 
        "대전", "충북 청주", "충남 천안", "전북 전주", "광주", 
        "전남 목포", "대구", "경북 포항", "부산", "울산", "경남 창원", "제주"
    ];

    window.onload = function() {
        initMap();
    };

    function initMap() {
        const mapContainer = document.getElementById('map');
        const defaultPosition = new kakao.maps.LatLng(36.5, 127.5); // 대한민국 중심

        const mapOptions = {
            center: defaultPosition,
            level: 12 // 전국 지도 레벨
        };

        map = new kakao.maps.Map(mapContainer, mapOptions);
        ps = new kakao.maps.services.Places();

        // 지도가 완전 렌더링되도록 처리
        setTimeout(function() {
            map.relayout();
            map.setCenter(defaultPosition);
            searchCurrentCategory();
        }, 150);

        window.addEventListener('resize', function() {
            map.relayout();
        });
    }

    function switchTab(category) {
        if (activeCategory === category) return;
        activeCategory = category;

        document.getElementById('btn-photo').classList.toggle('active', category === 'photo');
        document.getElementById('btn-passport').classList.toggle('active', category === 'passport');

        searchCurrentCategory();
    }

    function clearPreviousResults() {
        // 기존 마커 전체 지우기
        currentOverlayList.forEach(overlay => overlay.setMap(null));
        currentOverlayList = [];

        // 열려있는 팝업 지우기
        closePopup();

        document.getElementById('place-list').innerHTML = '';
        accumulatedPlaces = [];
    }

    function searchCurrentCategory() {
        clearPreviousResults();

        const config = TAB_CONFIG[activeCategory];
        let completedCount = 0;

        REGION_CENTERS.forEach(region => {
            const query = `${region} ${config.keyword}`;
            
            ps.keywordSearch(query, function(data, status) {
                completedCount++;
                if (status === kakao.maps.services.Status.OK) {
                    data.forEach(place => {
                        if (!accumulatedPlaces.some(p => p.id === place.id)) {
                            accumulatedPlaces.push(place);
                        }
                    });
                }

                if (completedCount === REGION_CENTERS.length) {
                    displayPlaces(accumulatedPlaces);
                }
            });
        });
    }

    function displayPlaces(places) {
        const listElement = document.getElementById('place-list');
        listElement.innerHTML = '';

        if (places.length === 0) {
            listElement.innerHTML = '<li style="text-align:center; padding:20px; color:#888;">검색 결과가 없습니다.</li>';
            return;
        }

        const currentEmoji = TAB_CONFIG[activeCategory].emoji;

        places.forEach((place) => {
            const placePosition = new kakao.maps.LatLng(place.y, place.x);

            // 1. 이모티콘 마커 오버레이 생성
            const markerElement = document.createElement('div');
            markerElement.className = 'emoji-marker';
            markerElement.innerHTML = currentEmoji;

            const customOverlay = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: markerElement,
                yAnchor: 1.0
            });

            customOverlay.setMap(map);
            currentOverlayList.push(customOverlay);

            // 마커 클릭 시 해당 마커 바로 위에 팝업 띄우기
            markerElement.addEventListener('click', function(e) {
                e.stopPropagation();
                openPopup(placePosition, place);
            });

            // 2. 왼쪽 리스트 생성
            const phoneText = place.phone ? place.phone : '전화번호 없음';
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;

            const listItem = document.createElement('li');
            listItem.innerHTML = `
                <div class="place-title">${currentEmoji} ${place.place_name}</div>
                <div class="place-address">${addressText}</div>
                <div class="place-phone">${phoneText}</div>
            `;

            // 목록 클릭 시 지도 중심 이동 & 해당 마커에 팝업 표출
            listItem.addEventListener('click', function() {
                map.setCenter(placePosition);
                map.setLevel(4);
                openPopup(placePosition, place);
            });

            listElement.appendChild(listItem);
        });
    }

    // 마커 클릭 시 정확한 좌표 위에 팝업 띄우기
    function openPopup(position, place) {
        // 기존 팝업이 있다면 무조건 먼저 제거
        closePopup();

        const phoneText = place.phone ? place.phone : '전화번호 없음';
        const addressText = place.road_address_name ? place.road_address_name : place.address_name;

        // 팝업 HTML 요소 직접 생성
        const popupContent = document.createElement('div');
        popupContent.className = 'custom-popup';
        popupContent.innerHTML = `
            <span class="popup-close" onclick="closePopup()">✕</span>
            <div class="popup-title">${place.place_name}</div>
            <div class="popup-address">${addressText}</div>
            <div class="popup-phone">📞 ${phoneText}</div>
        `;

        // 팝업을 해당 마커 좌표(position) 위치에 오버레이로 생성
        currentPopupOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: popupContent,
            yAnchor: 1.0,
            zIndex: 999
        });

        currentPopupOverlay.setMap(map);
    }

    // 열려 있는 팝업 닫기
    function closePopup() {
        if (currentPopupOverlay) {
            currentPopupOverlay.setMap(null);
            currentPopupOverlay = null;
        }
    }
</script>

</body>
</html>
