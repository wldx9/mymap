
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>증명사진관 · 여권민원실 찾기</title>

  <!-- 한국어 주석: 페이지 디자인 -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 360px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 22px 20px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #777;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 16px 15px;
    }

    .tab-button {
      flex: 1;
      padding: 13px 5px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      color: #555;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-button.active {
      color: #1769d2;
      border-color: #1769d2;
      background: #eaf3ff;
    }

    .search-info {
      padding: 12px 18px;
      background: #f7f8fa;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      color: #555;
      font-size: 12px;
      line-height: 1.6;
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 10px;
    }

    .result-heading strong {
      font-size: 15px;
    }

    #resultCount {
      color: #1769d2;
      font-size: 13px;
      font-weight: bold;
    }

    #status {
      margin: 0;
      padding: 0 18px 10px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    #placeList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #f7f9fc;
    }

    .place-item.selected {
      padding-left: 14px;
      border-left: 4px solid #1769d2;
      background: #eaf3ff;
    }

    .place-name {
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .place-address {
      margin-bottom: 5px;
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }

    .place-phone {
      color: #1769d2;
      font-size: 12px;
    }

    .empty-message {
      padding: 22px 18px;
      color: #777;
      font-size: 13px;
      line-height: 1.8;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    /* 한국어 주석: 증명사진관 및 여권민원실 이모티콘 마커 */
    .emoji-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 2px solid #1769d2;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.22);
      font-size: 23px;
      cursor: pointer;
      user-select: none;
    }

    .emoji-marker.passport {
      border-color: #e58b36;
    }

    /* 한국어 주석: 마커 좌표에 표시하는 상세정보 팝업 */
    .detail-popup {
      position: relative;
      width: 260px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .detail-title {
      margin-bottom: 10px;
      padding-right: 22px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .detail-row {
      margin-top: 7px;
      color: #555;
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .detail-label {
      color: #222;
      font-weight: bold;
    }

    .detail-close {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: #f1f2f4;
      font-size: 18px;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 44%;
        min-width: 0;
      }

      .header {
        padding: 15px 10px;
      }

      .header h1 {
        font-size: 16px;
      }

      .header p {
        font-size: 11px;
      }

      .tabs {
        gap: 5px;
        padding: 0 7px 10px;
      }

      .tab-button {
        padding: 10px 2px;
        font-size: 11px;
      }

      .search-info,
      .result-heading {
        padding-right: 9px;
        padding-left: 9px;
      }

      #status {
        padding-right: 9px;
        padding-left: 9px;
      }

      .place-item {
        padding: 12px 9px;
      }

      .place-item.selected {
        padding-left: 5px;
      }

      .place-name {
        font-size: 12px;
      }

      .place-address,
      .place-phone {
        font-size: 10px;
      }

      .detail-popup {
        width: 230px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- 한국어 주석: 왼쪽 탭 및 검색 결과 영역 -->
    <aside class="sidebar">
      <div class="header">
        <h1>📍 장소 찾기</h1>
        <p>지도를 이동하면 해당 지역의 장소를 새로 검색합니다.</p>
      </div>

      <div class="tabs">
        <button
          id="photoTab"
          class="tab-button active"
          type="button"
          data-type="photo"
          aria-pressed="true"
        >
          📸 증명사진관
        </button>

        <button
          id="passportTab"
          class="tab-button"
          type="button"
          data-type="passport"
          aria-pressed="false"
        >
          🧑‍💼 여권민원실
        </button>
      </div>

      <div id="searchInfo" class="search-info">
        📸 증명사진관을 검색합니다.
      </div>

      <div class="result-heading">
        <strong id="listTitle">증명사진관 목록</strong>
        <span id="resultCount">0곳</span>
      </div>

      <p id="status" role="status" aria-live="polite">
        지도를 준비하고 있습니다.
      </p>

      <div id="placeList">
        <div class="empty-message">검색 결과가 여기에 표시됩니다.</div>
      </div>
    </aside>

    <!-- 한국어 주석: 오른쪽 카카오맵 영역 -->
    <main id="map" aria-label="장소 검색 지도"></main>
  </div>

  <!-- 한국어 주석: 카카오맵 SDK와 장소 검색 서비스 불러오기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e8e9622fa2f314ccf70d3565b281d85e&libraries=services"></script>

  <script>
    // 한국어 주석: 지도 및 장소 검색에 사용할 변수
    let map;
    let places;
    let currentType = "photo";
    let markers = [];
    let selectedPlaceId = null;
    let detailOverlay = null;

    // 한국어 주석: 검색 요청과 지도 이벤트를 관리하는 변수
    let searchToken = 0;
    let mapSearchTimer = null;
    let isMapReady = false;

    // 한국어 주석: 탭별 검색어, 이모티콘, 화면 제목
    const searchConfig = {
      photo: {
        keyword: "증명사진",
        emoji: "📸",
        title: "증명사진관",
        info: "📸 현재 지도 화면에서 증명사진 관련 장소를 검색합니다."
      },
      passport: {
        keyword: "여권민원실",
        emoji: "🧑‍💼",
        title: "여권민원실",
        info: "🧑‍💼 현재 지도 화면에서 여권민원실을 검색합니다."
      }
    };

    // 한국어 주석: 검색 결과를 HTML에 안전하게 표시
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }

    // 한국어 주석: 기존 마커, 팝업, 목록을 모두 제거
    function clearResults() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
      selectedPlaceId = null;

      if (detailOverlay) {
        detailOverlay.setMap(null);
        detailOverlay = null;
      }

      document.getElementById("placeList").innerHTML = "";
      document.getElementById("resultCount").textContent = "0곳";
    }

    // 한국어 주석: 지도 초기화
    function initializeMap() {
      const mapContainer = document.getElementById("map");

      map = new kakao.maps.Map(mapContainer, {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
      });

      // 한국어 주석: 지도 객체를 연결해 현재 지도 영역 검색을 지원
      places = new kakao.maps.services.Places(map);
      isMapReady = true;

      // 한국어 주석: 지도 이동 또는 확대·축소가 끝나면 다시 검색
      kakao.maps.event.addListener(map, "idle", function () {
        scheduleMapSearch();
      });

      // 한국어 주석: 현재 위치를 얻으면 초기 지도 중심을 변경
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLocation = new kakao.maps.LatLng(
              position.coords.latitude,
              position.coords.longitude
            );

            map.setCenter(currentLocation);
            map.setLevel(5);

            // 한국어 주석: idle 이벤트가 발생하지 않는 상황에도 초기 검색 실행
            scheduleMapSearch();
          },
          function () {
            // 한국어 주석: 위치 권한이 없으면 기본 서울 지도에서 검색
            document.getElementById("status").textContent =
              "현재 위치를 사용할 수 없어 서울 시청 주변에서 시작합니다.";

            scheduleMapSearch();
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          }
        );
      } else {
        // 한국어 주석: 위치 기능이 없는 브라우저는 기본 지도에서 검색
        document.getElementById("status").textContent =
          "서울 시청 주변에서 검색을 시작합니다.";

        scheduleMapSearch();
      }
    }

    // 한국어 주석: 지도 조작이 연속으로 발생하면 마지막 조작 후 한 번만 검색
    function scheduleMapSearch() {
      if (!isMapReady) return;

      clearTimeout(mapSearchTimer);

      mapSearchTimer = setTimeout(function () {
        searchPlaces(currentType);
      }, 350);
    }

    // 한국어 주석: 탭 변경 시 기존 결과를 지우고 새 키워드로 검색
    function changeTab(type) {
      if (!searchConfig[type]) return;

      currentType = type;

      // 한국어 주석: 이전 검색 콜백이 나중에 도착해도 화면을 덮지 못하도록 무효화
      searchToken++;

      clearTimeout(mapSearchTimer);
      clearResults();

      document.querySelectorAll(".tab-button").forEach(function (button) {
        const isActive = button.dataset.type === type;

        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      document.getElementById("listTitle").textContent =
        searchConfig[type].title + " 목록";

      document.getElementById("searchInfo").textContent =
        searchConfig[type].info;

      document.getElementById("status").textContent =
        "현재 지도 화면의 장소를 검색하고 있습니다.";

      if (isMapReady) {
        searchPlaces(type);
      }
    }

    // 한국어 주석: 현재 지도 화면의 경계 안에서 장소 검색
    function searchPlaces(type) {
      if (!isMapReady || type !== currentType) return;

      const config = searchConfig[type];
      const token = ++searchToken;
      const foundPlaces = [];
      const seenIds = new Set();

      clearResults();

      document.getElementById("status").textContent =
        "현재 지도 영역에서 검색하고 있습니다.";

      // 한국어 주석: 현재 화면의 경계를 검색 옵션으로 자동 전달
      const options = {
        useMapBounds: true,
        size: 15,
        page: 1
      };

      // 한국어 주석: 검색 결과와 페이지네이션 처리
      function handleSearch(results, status, pagination) {
        // 한국어 주석: 검색 도중 탭이나 지도 영역이 바뀌었다면 이전 결과 무시
        if (token !== searchToken || type !== currentType) return;

        if (status === kakao.maps.services.Status.OK) {
          results.forEach(function (place) {
            const placeId = String(place.id || "");

            if (placeId && seenIds.has(placeId)) return;

            if (placeId) seenIds.add(placeId);
            foundPlaces.push(place);
          });

          // 한국어 주석: 다음 페이지가 있으면 계속 검색
          if (pagination.hasNextPage) {
            pagination.nextPage();
            return;
          }

          renderPlaces(foundPlaces, type);
          return;
        }

        if (status === kakao.maps.services.Status.ZERO_RESULT) {
          renderPlaces(foundPlaces, type);
          return;
        }

        document.getElementById("status").textContent =
          "검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";

        document.getElementById("placeList").innerHTML =
          '<div class="empty-message">' +
          "장소를 불러오지 못했습니다.<br>카카오 개발자 콘솔의 웹 도메인 설정도 확인해 주세요." +
          "</div>";
      }

      // 한국어 주석: 현재 선택된 키워드로 지도 화면 안의 장소 검색
      places.keywordSearch(config.keyword, handleSearch, options);
    }

    // 한국어 주석: 검색 결과를 왼쪽 목록과 지도 마커로 표시
    function renderPlaces(results, type) {
      const config = searchConfig[type];
      const list = document.getElementById("placeList");

      list.innerHTML = "";

      document.getElementById("resultCount").textContent =
        results.length + "곳";

      document.getElementById("status").textContent =
        results.length > 0
          ? "현재 지도 화면에서 " + results.length + "곳을 찾았습니다."
          : "현재 지도 화면에서 검색 결과가 없습니다.";

      if (results.length === 0) {
        list.innerHTML =
          '<div class="empty-message">' +
          "이 화면에서 검색 결과를 찾지 못했습니다.<br>" +
          "지도를 다른 지역으로 이동하거나 확대해 보세요." +
          "</div>";
        return;
      }

      results.forEach(function (place, index) {
        const placeId = String(place.id || index);
        const position = new kakao.maps.LatLng(place.y, place.x);

        // 한국어 주석: 왼쪽 장소 목록 항목 생성
        const item = document.createElement("div");

        item.className = "place-item";
        item.dataset.placeId = placeId;

        item.innerHTML =
          '<div class="place-name">' +
            escapeHtml(config.emoji + " " + place.place_name) +
          "</div>" +
          '<div class="place-address">' +
            escapeHtml(
              place.road_address_name ||
              place.address_name ||
              "주소 없음"
            ) +
          "</div>" +
          '<div class="place-phone">' +
            escapeHtml(place.phone || "전화번호 없음") +
          "</div>";

        // 한국어 주석: 목록을 누르면 해당 마커 위치로 이동하고 상세 팝업 표시
        item.addEventListener("click", function () {
          showPlaceDetails(place, position, placeId);
          map.panTo(position);
        });

        list.appendChild(item);

        // 한국어 주석: 탭별 이모티콘 마커 생성
        const markerElement = document.createElement("div");

        markerElement.className =
          "emoji-marker" + (type === "passport" ? " passport" : "");

        markerElement.textContent = config.emoji;
        markerElement.title = place.place_name;
        markerElement.setAttribute("role", "button");
        markerElement.setAttribute(
          "aria-label",
          place.place_name + " 상세정보 보기"
        );
        markerElement.tabIndex = 0;

        // 한국어 주석: CustomOverlay를 이용해 이모티콘을 실제 장소 좌표에 배치
        const markerOverlay = new kakao.maps.CustomOverlay({
          position: position,
          content: markerElement,
          xAnchor: 0.5,
          yAnchor: 1,
          zIndex: 2,
          clickable: true
        });

        markerOverlay.setMap(map);
        markers.push(markerOverlay);

        // 한국어 주석: 마커를 누르면 해당 장소의 상세 팝업 표시
        markerElement.addEventListener("click", function (event) {
          event.stopPropagation();
          showPlaceDetails(place, position, placeId);
        });

        // 한국어 주석: 키보드 Enter 또는 Space 키로도 상세정보 열기
        markerElement.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            showPlaceDetails(place, position, placeId);
          }
        });
      });
    }

    // 한국어 주석: 기존 팝업을 닫고 선택한 장소 위치에 새 팝업 표시
    function showPlaceDetails(place, position, placeId) {
      if (detailOverlay) {
        detailOverlay.setMap(null);
        detailOverlay = null;
      }

      selectedPlaceId = placeId;

      // 한국어 주석: 선택된 목록 항목을 시각적으로 강조
      document.querySelectorAll(".place-item").forEach(function (item) {
        item.classList.toggle(
          "selected",
          item.dataset.placeId === placeId
        );
      });

      const popup = document.createElement("div");
      popup.className = "detail-popup";

      popup.innerHTML =
        '<button class="detail-close" type="button" aria-label="팝업 닫기">×</button>' +
        '<div class="detail-title">' +
          escapeHtml(place.place_name || "장소 이름 없음") +
        "</div>" +
        '<div class="detail-row">' +
          '<span class="detail-label">주소</span><br>' +
          escapeHtml(
            place.road_address_name ||
            place.address_name ||
            "주소 없음"
          ) +
        "</div>" +
        '<div class="detail-row">' +
          '<span class="detail-label">전화번호</span><br>' +
          escapeHtml(place.phone || "전화번호 없음") +
        "</div>";

      // 한국어 주석: 팝업 닫기 버튼 동작
      popup.querySelector(".detail-close").addEventListener("click", function (event) {
        event.stopPropagation();

        if (detailOverlay) {
          detailOverlay.setMap(null);
          detailOverlay = null;
        }

        selectedPlaceId = null;

        document.querySelectorAll(".place-item").forEach(function (item) {
          item.classList.remove("selected");
        });
      });

      // 한국어 주석: 선택한 마커의 좌표를 기준으로 팝업 위치 지정
      detailOverlay = new kakao.maps.CustomOverlay({
        position: position,
        content: popup,
        xAnchor: 0.5,
        yAnchor: 1.15,
        zIndex: 10,
        clickable: true
      });

      detailOverlay.setMap(map);
    }

    // 한국어 주석: 탭 버튼에 이벤트 연결
    document.getElementById("photoTab").addEventListener("click", function () {
      changeTab("photo");
