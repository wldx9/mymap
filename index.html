<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 증명사진관 & 여권민원실 찾기</title>
    <!-- 카카오맵 API (services 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e8e9622fa2f314ccf70d3565b281d85e&libraries=services"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
        }
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* 왼쪽 사이드바 (탭 & 목록) */
        #sidebar {
            width: 340px;
            height: 100%;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            flex-shrink: 0;
            z-index: 10;
        }
        .tab-group {
            display: flex;
            background-color: #eee;
            border-bottom: 1px solid #ccc;
        }
        .tab-btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            background-color: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #fff;
            color: #000;
            border-bottom: 3px solid #ffeb00;
        }
        #place-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        #place-list li {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #fff;
        }
        #place-list li:hover {
            background-color: #f0f7ff;
        }
        #place-list .place-title {
            font-weight: bold;
            font-size: 14px;
            color: #222;
            margin-bottom: 4px;
        }
        #place-list .place-address {
            font-size: 12px;
            color: #666;
            line-height: 1.3;
        }
        #place-list .place-phone {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        /* 오른쪽 영역 (지도 전체) */
        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        /* 이모티콘 마커 스타일 */
        .emoji-marker {
            font-size: 20px;
            background: #ffffff;
            border: 2px solid #333;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
        }
        .emoji-marker:hover {
            transform: scale(1.2);
            z-index: 99;
        }

        /* 인포윈도우 팝업 스타일 */
        .info-popup {
            padding: 10px;
            font-size: 12px;
            line-height: 1.4;
            min-width: 180px;
        }
        .info-popup strong {
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
            color: #000;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 왼쪽 사이드바 -->
    <div id="sidebar">
        <div class="tab-group">
            <button class="tab-btn active" id="btn-photo" onclick="switchTab('photo')">📸 증명사진관</button>
            <button class="tab-btn" id="btn-passport" onclick="switchTab('passport')">🧑‍💼 여권민원실</button>
        </div>
        <ul id="place-list"></ul>
    </div>

    <!-- 메인 지도 (화면 전체 차지) -->
    <div id="map"></div>
</div>

<script>
    // 글로벌 변수 선언
    let map;
    let ps;
    let currentInfowindow = null; // 현재 지도에 열려있는 단 하나의 인포윈도우 객체
    
    let activeCategory = 'photo';
    let currentOverlayList = [];  // 지도 상의 오버레이 마커 리스트
    let accumulatedPlaces = [];   // 수집된 전체 장소 데이터 리스트

    // 탭별 키워드 및 이모티콘 설정
    const TAB_CONFIG = {
        photo: { keyword: '증명사진', emoji: '📸' },
        passport: { keyword: '여권민원실', emoji: '🧑‍💼' }
    };

    // 전국 균일 검색을 위한 광역 거점 리스트
    const REGION_CENTERS = [
        "서울", "경기 수원", "경기 고양", "인천", "강원 춘천", 
        "대전", "충북 청주", "충남 천안", "전북 전주", "광주", 
        "전남 목포", "대구", "경북 포항", "부산", "울산", "경남 창원", "제주"
    ];

    window.onload = function() {
        initMap();
    };

    // 지도 초기화 함수
    function initMap() {
        const mapContainer = document.getElementById('map');
        const defaultPosition = new kakao.maps.LatLng(36.5, 127.5); // 대한민국 중심 좌표

        const mapOptions = {
            center: defaultPosition,
            level: 12 // 전국 지도 레벨
        };

        map = new kakao.maps.Map(mapContainer, mapOptions);
        ps = new kakao.maps.services.Places();

        // 팝업 생성을 위한 단일 InfoWindow 객체 생성
        currentInfowindow = new kakao.maps.InfoWindow({
            zIndex: 1,
            removable: true
        });

        // 지도가 완전 렌더링된 뒤 검색 실행 (회색 깨짐 완벽 방지)
        setTimeout(function() {
            map.relayout();
            map.setCenter(defaultPosition);
            searchCurrentCategory();
        }, 200);

        // 창 크기가 달라질 때 지도 비율 자동 재설정
        window.addEventListener('resize', function() {
            map.relayout();
        });
    }

    // 탭 전환 함수
    function switchTab(category) {
        if (activeCategory === category) return;
        activeCategory = category;

        document.getElementById('btn-photo').classList.toggle('active', category === 'photo');
        document.getElementById('btn-passport').classList.toggle('active', category === 'passport');

        searchCurrentCategory();
    }

    // 기존 마커, 리스트, 팝업 지우기
    function clearPreviousResults() {
        // 기존 오버레이 마커 제거
        currentOverlayList.forEach(overlay => overlay.setMap(null));
        currentOverlayList = [];

        // 인포윈도우 팝업 닫기
        if (currentInfowindow) {
            currentInfowindow.close();
        }

        document.getElementById('place-list').innerHTML = '';
        accumulatedPlaces = [];
    }

    // 카테고리 검색 수행
    function searchCurrentCategory() {
        clearPreviousResults();

        const config = TAB_CONFIG[activeCategory];
        let completedCount = 0;

        REGION_CENTERS.forEach(region => {
            const query = `${region} ${config.keyword}`;
            
            ps.keywordSearch(query, function(data, status) {
                completedCount++;
                if (status === kakao.maps.services.Status.OK) {
                    data.forEach(place => {
                        // 중복 장소 제거
                        if (!accumulatedPlaces.some(p => p.id === place.id)) {
                            accumulatedPlaces.push(place);
                        }
                    });
                }

                // 모든 지역 검색 완료 시 화면에 노출
                if (completedCount === REGION_CENTERS.length) {
                    displayPlaces(accumulatedPlaces);
                }
            });
        });
    }

    // 장소 목록 및 마커 표시
    function displayPlaces(places) {
        const listElement = document.getElementById('place-list');
        listElement.innerHTML = '';

        if (places.length === 0) {
            listElement.innerHTML = '<li style="text-align:center; padding:20px; color:#888;">검색 결과가 없습니다.</li>';
            return;
        }

        const currentEmoji = TAB_CONFIG[activeCategory].emoji;

        places.forEach((place) => {
            const placePosition = new kakao.maps.LatLng(place.y, place.x);

            // 1. 커스텀 오버레이 마커 생성
            const markerElement = document.createElement('div');
            markerElement.className = 'emoji-marker';
            markerElement.innerHTML = currentEmoji;

            const customOverlay = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: markerElement,
                yAnchor: 1.1
            });

            customOverlay.setMap(map);
            currentOverlayList.push(customOverlay);

            // 마커 클릭 시 해당 좌표 위치에서만 팝업 표시 (이전 팝업 자동 제거)
            markerElement.addEventListener('click', function() {
                openPopup(placePosition, place);
            });

            // 2. 왼쪽 사이드바 리스트 아이템 생성
            const phoneText = place.phone ? place.phone : '전화번호 없음';
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;

            const listItem = document.createElement('li');
            listItem.innerHTML = `
                <div class="place-title">${currentEmoji} ${place.place_name}</div>
                <div class="place-address">${addressText}</div>
                <div class="place-phone">${phoneText}</div>
            `;

            // 목록 클릭 시 지도 중심 이동 및 확대 후 해당 마커 위에 팝업 오픈
            listItem.addEventListener('click', function() {
                map.setCenter(placePosition);
                map.setLevel(4);
                openPopup(placePosition, place);
            });

            listElement.appendChild(listItem);
        });
    }

    // 마커 좌표 위치에 단일 팝업을 띄우는 전용 함수
    function openPopup(position, place) {
        // 기존 팝업 닫기
        currentInfowindow.close();

        const phoneText = place.phone ? place.phone : '전화번호 없음';
        const addressText = place.road_address_name ? place.road_address_name : place.address_name;

        const popupContent = `
            <div class="info-popup">
                <strong>${place.place_name}</strong>
                <div>${addressText}</div>
                <div style="color: #666; margin-top:2px;">📞 ${phoneText}</div>
            </div>
        `;

        // 해당 좌표로 팝업 위치 및 내용 재설정 후 열기
        currentInfowindow.setContent(popupContent);
        currentInfowindow.setPosition(position);
        currentInfowindow.open(map);
    }
</script>

</body>
</html>
