<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 증명사진관 & 여권민원실 찾기</title>
    <!-- 카카오맵 API (services 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e8e9622fa2f314ccf70d3565b281d85e&libraries=services"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* 왼쪽 사이드바 (탭 & 리스트) */
        #sidebar {
            width: 340px;
            height: 100%;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
            flex-shrink: 0;
            z-index: 10;
        }
        /* 탭 버튼 영역 */
        .tab-group {
            display: flex;
            border-bottom: 1px solid #ccc;
        }
        .tab-btn {
            flex: 1;
            padding: 15px 0;
            border: none;
            background-color: #eee;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #fff;
            color: #333;
            border-bottom: 3px solid #ffeb00;
        }
        /* 장소 목록 리스트 */
        #place-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        #place-list li {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #fff;
        }
        #place-list li:hover {
            background-color: #f0f8ff;
        }
        #place-list .place-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        #place-list .place-address {
            font-size: 12px;
            color: #666;
        }
        #place-list .place-phone {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        /* 메인 콘텐츠 (지도 & 로드뷰 영역) */
        #main-content {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #map {
            width: 100%;
            height: 60%;
            position: relative;
        }
        #roadview-container {
            width: 100%;
            height: 40%;
            position: relative;
            border-top: 2px solid #ccc;
            background-color: #e5e5e5;
        }
        #roadview {
            width: 100%;
            height: 100%;
        }
        /* 로드뷰 없음 안내 메시지 오버레이 */
        #roadview-no-data {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(245, 245, 245, 0.95);
            color: #666;
            font-size: 16px;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        /* 커스텀 오버레이/이모티콘 마커 스타일 */
        .emoji-marker {
            font-size: 20px;
            background: #ffffff;
            border: 2px solid #333;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .emoji-marker:hover {
            transform: scale(1.2);
            z-index: 10;
        }
        /* 인포윈도우 스타일 */
        .info-popup {
            padding: 10px;
            font-size: 12px;
            line-height: 1.4;
            max-width: 220px;
        }
        .info-popup strong {
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
            color: #000;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 왼쪽 사이드바 -->
    <div id="sidebar">
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('photo')">📸 증명사진관</button>
            <button class="tab-btn" onclick="switchTab('passport')">🧑‍💼 여권민원실</button>
        </div>
        <ul id="place-list"></ul>
    </div>

    <!-- 메인 지도 및 로드뷰 영역 -->
    <div id="main-content">
        <div id="map"></div>
        <div id="roadview-container">
            <div id="roadview"></div>
            <div id="roadview-no-data">지도 위의 마커를 누르면 거리뷰가 표시됩니다</div>
        </div>
    </div>
</div>

<script>
    // 글로벌 변수 선언
    let map;
    let roadview;
    let roadviewClient;
    let ps; // 장소 검색 객체
    let currentInfowindow = null; // 현재 열린 인포윈도우
    
    let activeCategory = 'photo'; // 현재 활성화된 탭
    let currentOverlayList = [];  // 마커 오버레이 목록
    let searchResultsList = [];   // 누적 검색 결과 리스트

    const TAB_CONFIG = {
        photo: { keyword: '증명사진', emoji: '📸' },
        passport: { keyword: '여권민원실', emoji: '🧑‍💼' }
    };

    window.onload = function() {
        initMap();
    };

    function initMap() {
        const mapContainer = document.getElementById('map');
        const defaultPosition = new kakao.maps.LatLng(37.566826, 126.9786567); // 서울시청

        const mapOptions = {
            center: defaultPosition,
            level: 7 // 전역을 더 넓게 보도록 레벨 조정
        };

        map = new kakao.maps.Map(mapContainer, mapOptions);

        // 로드뷰 객체 초기화
        const roadviewContainer = document.getElementById('roadview');
        roadview = new kakao.maps.Roadview(roadviewContainer);
        roadviewClient = new kakao.maps.RoadviewClient();

        ps = new kakao.maps.services.Places();

        // 지도가 움직이거나 축소/확대 완료 시 범위 내 자동 다시 검색
        kakao.maps.event.addListener(map, 'idle', function() {
            searchCurrentCategory();
        });

        // 사용자 현재 위치 확인
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setCenter(new kakao.maps.LatLng(lat, lng));
                    searchCurrentCategory();
                },
                function() {
                    searchCurrentCategory();
                }
            );
        } else {
            searchCurrentCategory();
        }

        // 창 크기가 변경될 때 지도 깨짐 방지
        window.addEventListener('resize', function() {
            map.relayout();
        });
    }

    function switchTab(category) {
        if (activeCategory === category) return;
        activeCategory = category;

        const buttons = document.querySelectorAll('.tab-btn');
        buttons[0].classList.toggle('active', category === 'photo');
        buttons[1].classList.toggle('active', category === 'passport');

        searchCurrentCategory();
    }

    function clearPreviousResults() {
        currentOverlayList.forEach(overlay => overlay.setMap(null));
        currentOverlayList = [];

        if (currentInfowindow) {
            currentInfowindow.close();
        }

        document.getElementById('place-list').innerHTML = '';
        searchResultsList = [];
    }

    function searchCurrentCategory() {
        clearPreviousResults();
        map.relayout(); // 레이아웃 정상화

        const config = TAB_CONFIG[activeCategory];
        const searchOptions = {
            bounds: map.getBounds(),
            useMapBounds: true
        };

        // 검색 실행
        ps.keywordSearch(config.keyword, placesSearchCB, searchOptions);
    }

    // 카카오 검색 콜백 함수 (최대 45개까지 자동으로 3페이지 불러오기)
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            searchResultsList = searchResultsList.concat(data);

            // 다음 페이지가 존재하고, 총 3페이지(45개)까지 누적 검색
            if (pagination.hasNextPage && pagination.current < 3) {
                pagination.nextPage();
            } else {
                // 검색이 모두 끝나면 지도 및 목록 표출
                displayPlaces(searchResultsList);
            }
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            document.getElementById('place-list').innerHTML = '<li style="text-align:center; padding:20px; color:#888;">현재 화면 영역 내 검색 결과가 없습니다.</li>';
        }
    }

    function displayPlaces(places) {
        const listElement = document.getElementById('place-list');
        listElement.innerHTML = '';
        const currentEmoji = TAB_CONFIG[activeCategory].emoji;

        places.forEach((place) => {
            const placePosition = new kakao.maps.LatLng(place.y, place.x);

            // 1. 커스텀 마커 생성
            const markerElement = document.createElement('div');
            markerElement.className = 'emoji-marker';
            markerElement.innerHTML = currentEmoji;

            const customOverlay = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: markerElement,
                yAnchor: 1
            });

            customOverlay.setMap(map);
            currentOverlayList.push(customOverlay);

            // 2. 인포윈도우 (팝업)
            const phoneText = place.phone ? place.phone : '전화번호 없음';
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;

            const popupContent = `
                <div class="info-popup">
                    <strong>${place.place_name}</strong>
                    <div>${addressText}</div>
                    <div style="color: #666; margin-top:2px;">📞 ${phoneText}</div>
                </div>
            `;

            const infowindow = new kakao.maps.InfoWindow({
                content: popupContent,
                removable: true
            });

            markerElement.addEventListener('click', function() {
                selectPlace(placePosition, infowindow, customOverlay);
            });

            // 3. 왼쪽 사이드바 리스트 생성
            const listItem = document.createElement('li');
            listItem.innerHTML = `
                <div class="place-title">${currentEmoji} ${place.place_name}</div>
                <div class="place-address">${addressText}</div>
                <div class="place-phone">${phoneText}</div>
            `;

            listItem.addEventListener('click', function() {
                map.panTo(placePosition);
                selectPlace(placePosition, infowindow, customOverlay);
            });

            listElement.appendChild(listItem);
        });
    }

    function selectPlace(position, infowindow, overlay) {
        if (currentInfowindow) {
            currentInfowindow.close();
        }

        infowindow.open(map, overlay);
        currentInfowindow = infowindow;

        updateRoadview(position);
    }

    function updateRoadview(position) {
        const noDataOverlay = document.getElementById('roadview-no-data');

        roadviewClient.getNearestPanoId(position, 50, function(panoId) {
            if (panoId === null) {
                noDataOverlay.innerText = '선택한 장소 근처에 거리뷰(로드뷰)가 없습니다.';
                noDataOverlay.style.display = 'flex';
            } else {
                noDataOverlay.style.display = 'none';
                roadview.setPanoId(panoId, position);
            }
        });
    }
</script>

</body>
</html>
